# Mosquitto Access Control List (ACL) Configuration for Shuttle Tracking System

# -----------------------------------------------------------------------------
# 1. Anonymous / Public Development Access
# -----------------------------------------------------------------------------
# Allow read/write to all vehicle topics during development & local testing
topic readwrite vehicles/#
topic read $SYS/#

# -----------------------------------------------------------------------------
# 2. Backend Service
# -----------------------------------------------------------------------------
# Dedicated service user with full access to vehicle ingestion and commands
user backend
topic readwrite vehicles/#
topic readwrite $SYS/#

# -----------------------------------------------------------------------------
# 3. Vehicle Patterns
# -----------------------------------------------------------------------------
# Devices authenticating with username matching vehicle ID
# %u = username, %c = clientid
pattern readwrite vehicles/%u/#
