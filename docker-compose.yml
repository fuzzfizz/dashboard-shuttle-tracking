services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: shuttle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shuttle_tracking
      POSTGRES_USER: shuttle
      POSTGRES_PASSWORD: shuttle_secret_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuttle -d shuttle_tracking"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: shuttle-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl.conf:/mosquitto/config/acl.conf:ro
      - mosq_data:/mosquitto/data
      - mosq_log:/mosquitto/log

  redis:
    image: redis:7-alpine
    container_name: shuttle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shuttle-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://shuttle:shuttle_secret_dev@postgres:5432/shuttle_tracking
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      REDIS_URL: redis://redis:6379
      JWT_SECRET: shuttle_jwt_super_secret_key_2026
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shuttle-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - api

volumes:
  pg_data:
  mosq_data:
  mosq_log:
  redis_data:
